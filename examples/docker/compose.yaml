services:
  opencode:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        OPENCODE_VERSION: 2.4.1
    environment:
      OPENCODE_SERVER_USERNAME: opencode
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?set this in a protected env file}
      OPENCODE_SERVER_PORT: 4096
    expose:
      - "4096"
    volumes:
      - opencode-workspace:/workspace
    restart: unless-stopped
    # Keep this service on a private project network; do not publish 4096 to the host.

volumes:
  opencode-workspace:
